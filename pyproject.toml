[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlslime-workspace"
version = "0.1.1"
description = "DLSlime monorepo meta-package (data plane + control plane)"
authors = [{ name = "JimyMa", email = "hit16s105116@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
# Default install: data-plane only.
dependencies = [
    "dlslime @ file:./dlslime",
]

# Install individual components:
#   pip install -e .           # data plane only (PeerAgent + NanoCtrlClient)
#   pip install -e .[ctrl]     # + dlslime-ctrl Rust server
#   pip install -e .[all]      # everything
[project.optional-dependencies]
ctrl = [
    "dlslime-ctrl @ file:./dlslime-ctrl",
]
all = [
    "dlslime @ file:./dlslime",
    "dlslime-ctrl @ file:./dlslime-ctrl",
]

[tool.setuptools]
py-modules = []
