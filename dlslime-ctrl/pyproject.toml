[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dlslime-ctrl"
version = "0.1.4"
description = "DLSlime control-plane server (Redis-backed service registry and peer-agent coordinator)"
requires-python = ">=3.10"
# The Python client lives in the `dlslime` package as `dlslime.ctrl.NanoCtrlClient`.
# This wheel only ships the Rust `nanoctrl` server binary.
dependencies = []

[project.urls]
Repository = "https://github.com/DeepLink-org/DLSlime"

[tool.maturin]
bindings = "bin"
